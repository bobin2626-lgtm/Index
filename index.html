<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Galaxia para ti</title>
  <meta name="description" content="Galaxia interactiva de frases de cariño 💘">
  
  <meta property="og:title" content="Galaxia para ti">
  <meta property="og:description" content="Una galaxia interactiva con palabras de cariño 💖">
  <meta property="og:image" content="og-cover.png">
  
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    
    #galaxy-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    
    .attribution {
      position: fixed;
      left: 10px;
      bottom: 10px;
      font-size: 11px;
      color: #b9a0ff;
      opacity: .8;
      background: rgba(0,0,0,.35);
      padding: 6px 8px;
      border-radius: 8px;
      z-index: 10;
    }
    
    .player {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(20,15,35,.35);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      padding: 8px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial;
      z-index: 10;
    }
    
    .player button {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      color: #fff;
      cursor: pointer;
    }
    
    .player input[type=file] {
      display: none;
    }
    
    .pill {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.18);
      color: #fff;
      font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial;
      white-space: nowrap;
      z-index: 10;
    }

    /* ESTILOS FLOTANTES DEL CONTADOR DE TIEMPO RECIÉN AGREGADO */
    .floating-counter {
      position: fixed;
      top: 48px; /* Ubicado abajo de la barra .pill */
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 8, 28, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 6px 14px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 10;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-width: 260px;
    }

    .counter-digits {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .time-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 42px;
    }

    .time-val {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 6px rgba(234, 174, 255, 0.6);
    }

    .time-lbl {
      font-size: 8px;
      color: #dfbaff;
      letter-spacing: 0.5px;
      margin-top: 1px;
      font-weight: 500;
    }
    
    .error {
      position: fixed;
      inset: auto 10px 70px 10px;
      background: #260015;
      color: #ffd9f7;
      border: 1px solid #ff8ae5;
      border-radius: 10px;
      padding: 10px;
      font: 12px system-ui;
      display: none;
      z-index: 100;
    }

    /* CAPA DE BIENVENIDA PARA REPRODUCCIÓN AUTOMÁTICA */
    #welcome-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(5, 2, 15, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s;
    }
    #welcome-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #startBtn {
      padding: 15px 30px;
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #a044ff, #6a11cb);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(160, 68, 255, 0.4);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 4px 20px rgba(160, 68, 255, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 4px 30px rgba(160, 68, 255, 0.7); }
      100% { transform: scale(1); box-shadow: 0 4px 20px rgba(160, 68, 255, 0.4); }
    }

    /* INTERFAZ MODAL INTERACTIVA PARA CARTAS ABIERTAS */
    #card-modal {
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    #card-modal.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: rgba(22, 14, 35, 0.95);
      border: 1px solid rgba(234, 174, 255, 0.25);
      padding: 16px;
      border-radius: 20px;
      max-width: 85%;
      width: 330px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(160, 68, 255, 0.35);
      transform: scale(0.85);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #card-modal.active .modal-content {
      transform: scale(1);
    }
    .modal-content img {
      width: 100%;
      height: auto;
      max-height: 360px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #090510;
    }
    .modal-text {
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      margin-top: 14px;
      margin-bottom: 4px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .close-btn {
      margin-top: 12px;
      padding: 8px 22px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 50px;
      cursor: pointer;
      font-size: 13px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="welcome-overlay">
    <button id="startBtn">Entrar a tu galaxia 🌌</button>
  </div>

  <div id="card-modal">
    <div class="modal-content">
      <img id="modal-img" src="" alt="Recuerdo">
      <div id="modal-text" class="modal-text"></div>
      <button class="close-btn" id="closeModalBtn">Guardar Carta 💌</button>
    </div>
  </div>

  <canvas id="galaxy-canvas"></canvas>
  
  <div class="pill">Te Amo Muchote Mis Ojitos Brillantes💛 (Busca las mini cartas 💌 ocultas)</div>

  <div class="floating-counter">
    <div class="counter-digits">
      <div class="time-unit"><span class="time-val" id="count-days">00</span><span class="time-lbl">DÍAS</span></div>
      <div class="time-unit"><span class="time-val" id="count-hours">00</span><span class="time-lbl">HRS</span></div>
      <div class="time-unit"><span class="time-val" id="count-mins">00</span><span class="time-lbl">MINS</span></div>
      <div class="time-unit"><span class="time-val" id="count-secs">00</span><span class="time-lbl">SEGS</span></div>
    </div>
  </div>
  
  <div class="attribution">Base: tlanex · Adaptación para Jotab 💫</div>
  
  <div id="err" class="error"></div>
  
  <div class="player">
    <button id="playBtn">⏸︎</button>
    <span style="font-size:12px; opacity:.9">
      Escuchando: <b>Love Story - Taylor Swift</b> Detalles Mr<b>💙🌹♥️</b> (Reproductor Mr”)
    </span>
    <input type="file" id="pickFile" accept="audio/*">
    <button id="pickBtn">Elegir otra canción</button>
    <audio id="audio" preload="auto" loop>
      <source src="YTDown_YouTube_Media_iGShG2i3RU_008_128k.mp3" type="audio/mpeg">
    </audio>
  </div>
  
  <canvas id="fx" style="position: fixed; inset: 0; pointer-events: none; z-index: 5;"></canvas>

  <script>
    (function() {
      const err = document.getElementById('err');
      function showError(msg) { 
        err.textContent = msg; 
        err.style.display = 'block'; 
      }

      // ==========================================
      // ====== LÓGICA DEL CONTADOR DE TIEMPO =====
      // ==========================================
      // Fecha fijada exactamente el 26 de Abril de 2026 (Mes index-0, donde 3 es Abril)
      const startDate = new Date(2026, 3, 26, 0, 0, 0); 

      function updateRelationshipCounter() {
        const now = new Date();
        const diffMs = now - startDate;

        if (diffMs < 0) {
          document.getElementById('count-days').textContent = "00";
          document.getElementById('count-hours').textContent = "00";
          document.getElementById('count-mins').textContent = "00";
          document.getElementById('count-secs').textContent = "00";
          return;
        }

        const totalSecs = Math.floor(diffMs / 1000);
        const totalMins = Math.floor(totalSecs / 60);
        const totalHours = Math.floor(totalMins / 60);
        const days = Math.floor(totalHours / 24);

        const hours = totalHours % 24;
        const mins = totalMins % 60;
        const secs = totalSecs % 60;

        document.getElementById('count-days').textContent = days;
        document.getElementById('count-hours').textContent = hours < 10 ? '0' + hours : hours;
        document.getElementById('count-mins').textContent = mins < 10 ? '0' + mins : mins;
        document.getElementById('count-secs').textContent = secs < 10 ? '0' + secs : secs;
      }

      // Se ejecuta de inmediato y se actualiza cada segundo
      updateRelationshipCounter();
      setInterval(updateRelationshipCounter, 1000);

      // ==========================================
      // ====== LOGICA DE AUTO-PLAY AL ENTRAR =====
      // ==========================================
      const overlay = document.getElementById('welcome-overlay');
      const startBtn = document.getElementById('startBtn');
      const audio = document.getElementById('audio');
      const playBtn = document.getElementById('playBtn');

      startBtn.onclick = () => {
        overlay.classList.add('hidden');
        audio.play()
          .then(() => {
            playBtn.textContent = '⏸︎';
          })
          .catch((e) => {
            console.error("Error reproduciendo audio:", e);
            showError('Si no suena, comprueba que el archivo "YTDown_YouTube_Media_iGShG2i3RU_008_128k.mp3" no tenga letras de más o de menos en tu carpeta.');
            playBtn.textContent = '▶︎';
          });
      };

      // ==========================================
      // ====== CONTROLES DE AUDIO CONT. ==========
      // ==========================================
      const pickBtn = document.getElementById('pickBtn');
      const pickFile = document.getElementById('pickFile');

      playBtn.onclick = async () => {
        try { 
          if (audio.paused) { 
            await audio.play(); 
            playBtn.textContent = '⏸︎'; 
          } else { 
            audio.pause(); 
            playBtn.textContent = '▶︎'; 
          } 
        } catch(e) { 
          showError('Ocurrió un problema con el reproductor.'); 
        }
      };

      pickBtn.onclick = () => pickFile.click();

      pickFile.onchange = () => {
        if (pickFile.files && pickFile.files[0]) {
          const url = URL.createObjectURL(pickFile.files[0]);
          audio.src = url; 
          audio.play()
            .then(() => playBtn.textContent = '⏸︎')
            .catch(() => {});
        }
      };

      // ==========================================
      // ====== ARREGLOS Y POOL INTERACTIVO =======
      // ==========================================
      const phrases = [
        "Pinchecha ✨", " Hermosa 💛", "Mi Bebe", "Mi Cielito 🌌", "Hermosota ✨", 
        "Mi Infinita ♾️", "Mi Todo", "Me Encantas 🥰", " Perla 💫", "Te Amo💛", 
        "Mi Canción Favorita 🎶", "Unica 😊", "Mi Reina 👑", "Mi Amor", "Mi Mundo", 
        "Mi Luz 🌠", "Mi Niña", "Mi Tesoro💛", "Mi Paz", "Mi Eterna", 
        "Mi Sueño", "Mi Pensamiento Favorito", "Mi Bombom", "Mi Diosa", "Te Amo Infinitamente ♾️"
      ];

      const cardModal = document.getElementById('card-modal');
      const modalImg = document.getElementById('modal-img');
      const modalText = document.getElementById('modal-text');
      const closeModalBtn = document.getElementById('closeModalBtn');

      closeModalBtn.onclick = () => { cardModal.classList.remove('active'); };

      const totalImages = 18;
      let availableImages = [];
      
      function resetImagePool() {
        availableImages = Array.from({length: totalImages}, (_, i) => i + 1);
        for (let i = availableImages.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [availableImages[i], availableImages[j]] = [availableImages[j], availableImages[i]];
        }
      }
      resetImagePool();

      function openVisualCard() {
        if (availableImages.length === 0) resetImagePool();
        const imgNum = availableImages.pop();
        const randomMsg = phrases[Math.floor(Math.random() * phrases.length)];
        
        modalImg.src = `im${imgNum}.png`;
        modalText.textContent = randomMsg;
        cardModal.classList.add('active');
      }

      // ==========================================
      // ====== VALIDACIÓN DE WEBGL ===============
      // ==========================================
      try {   
        const test = document.createElement('canvas').getContext('webgl') || document.createElement('canvas').getContext('experimental-webgl');
        if (!test) throw new Error('Tu navegador no tiene WebGL activo');
      } catch(e) { 
        showError('WebGL parece desactivado. Prueba con Chrome/Edge/Firefox, o habilita aceleración por hardware.'); 
        return; 
      }

      // ==========================================
      // ====== RENDERIZADO DE GALAXIA 3D =========
      // ==========================================
      try {
        const canvas = document.getElementById('galaxy-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.06;
        controls.minDistance = 10; 
        controls.maxDistance = 220;
        controls.target.set(0, 0, 0);

        function setCam() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          const isMobile = w < 768 || w < h;
          camera.fov = isMobile ? 90 : 75;
          camera.position.set(0, isMobile ? 26 : 22, isMobile ? 110 : 75);
          camera.updateProjectionMatrix(); 
          controls.update();
        } 
        setCam();
        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          setCam();
        });

        function makePrettyStarTexture(size = 1024, count = 2000) {
          const c = document.createElement('canvas'); 
          c.width = c.height = size;
          const g = c.getContext('2d');
          
          const r = size / 2;
          const bg = g.createRadialGradient(r, r, r * 0.2, r, r, r);
          bg.addColorStop(0, '#050010');
          bg.addColorStop(1, '#000000');
          g.fillStyle = bg; 
          g.fillRect(0, 0, size, size);

          for (let i = 0; i < count; i++) {
            const x = Math.random() * size;
            const y = Math.random() * size;
            const base = Math.random() * 0.7 + 0.3; 
            const glow = g.createRadialGradient(x, y, 0, x, y, Math.random() * 2.2 + 1.6);
            
            const huePick = Math.random();
            let colInner = 'rgba(255,255,255,' + (0.65 * base) + ')';
            let colOuter = 'rgba(180,190,255,' + (0.12 * base) + ')';
            if (huePick < 0.25) { 
              colOuter = 'rgba(255,180,240,' + (0.12 * base) + ')'; 
            }
            
            glow.addColorStop(0, colInner);
            glow.addColorStop(1, colOuter);
            g.fillStyle = glow; 
            g.beginPath(); 
            g.arc(x, y, Math.random() * 1.2 + 0.6, 0, Math.PI * 2); 
            g.fill();
          }
          return new THREE.CanvasTexture(c);
        }

        const bgGeo = new THREE.SphereGeometry(600, 64, 64);
        const starTex = makePrettyStarTexture(1024, 2600);
        starTex.wrapS = starTex.wrapT = THREE.RepeatWrapping;
        const bg = new THREE.Mesh(bgGeo, new THREE.MeshBasicMaterial({ 
          map: starTex, 
          side: THREE.BackSide, 
          transparent: false, 
          opacity: 0.85 
        }));
        scene.add(bg);

        const galaxy = new THREE.Group(); 
        scene.add(galaxy);

        const phraseCount = Math.max(phrases.length * 6, 180);
        const arms = 5, radius = 82, maxH = 22;

        function makeTextTexture(text, size = 48) {
          const c = document.createElement('canvas'); 
          c.width = 1024; 
          c.height = 128;
          const g = c.getContext('2d'); 
          g.clearRect(0, 0, c.width, c.height);
          g.font = '800 ' + size + 'px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial';
          g.textAlign = 'center'; 
          g.textBaseline = 'middle';
          g.shadowColor = 'rgba(210,140,255,0.95)'; 
          g.shadowBlur = 24;
          g.fillStyle = 'rgba(255,240,255,0.98)'; 
          g.fillText(text, c.width / 2, c.height / 2);
          return new THREE.CanvasTexture(c);
        }

        for (let i = 0; i < phraseCount; i++) {
          const text = phrases[i % phrases.length];
          const tex = makeTextTexture(text, 48);
          const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
          spr.isPhrase = true;
          
          const perArm = phraseCount / arms; 
          const ang = (i % perArm) * (Math.PI * 2 / perArm);
          const armAng = Math.floor(i / perArm) * (Math.PI * 2 / arms);
          const dist = Math.pow(i / phraseCount, 0.72) * radius;
          const thickness = Math.pow(1 - (dist / radius), 2);
          
          const x = Math.cos(ang + armAng) * dist;
          const z = Math.sin(ang + armAng) * dist;
          const y = (Math.random() - 0.5) * maxH * thickness * .9;
          
          spr.position.set(x, y, z); 
          spr.scale.set(20, 2.6, 1); 
          galaxy.add(spr);
        }

        const starCount = 8000;
        const geom = new THREE.BufferGeometry();
        const pos = new Float32Array(starCount * 3);
        
        for (let i = 0; i < starCount; i++) {
          const ang = Math.random() * Math.PI * 2;
          const dist = Math.random() * radius * 1.15;
          const y = (Math.random() - 0.5) * 36 * Math.pow(1 - Math.min(dist, radius) / radius, 1.5);
          
          pos[i * 3] = Math.cos(ang) * dist; 
          pos[i * 3 + 1] = y; 
          pos[i * 3 + 2] = Math.sin(ang) * dist; 
        }
        geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        galaxy.add(new THREE.Points(geom, new THREE.PointsMaterial({ 
          color: 0xffffff, 
          size: 0.28, 
          transparent: true, 
          opacity: 0.65, 
          blending: THREE.AdditiveBlending 
        })));

        function makeEnvelopeTexture() {
          const c = document.createElement('canvas'); c.width = 256; c.height = 180;
          const g = c.getContext('2d');
          g.fillStyle = '#22123b'; g.fillRect(0, 0, 256, 180);
          g.strokeStyle = '#eaaeef'; g.lineWidth = 8; g.strokeRect(4, 4, 248, 172);
          g.beginPath(); g.moveTo(4, 4); g.lineTo(128, 95); g.lineTo(252, 4); g.stroke();
          g.fillStyle = '#ff6da0'; g.font = '42px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
          g.fillText('💌', 128, 115);
          return new THREE.CanvasTexture(c);
        }

        const envelopeTex = makeEnvelopeTexture();
        const cardGeometry = new THREE.PlaneGeometry(2.5, 1.7);
        const cardMaterial = new THREE.MeshBasicMaterial({ map: envelopeTex, side: THREE.DoubleSide, transparent: true });
        const interactiveCards = [];

        for (let i = 0; i < 18; i++) {
          const mesh = new THREE.Mesh(cardGeometry, cardMaterial);
          const angle = (i / 18) * Math.PI * 6;
          const dist = 30 + (i / 18) * 48; 
          
          mesh.position.set(
            Math.cos(angle) * dist,
            (Math.random() - 0.5) * 14,
            Math.sin(angle) * dist
          );
          mesh.rotation.set(Math.random() * 0.4, Math.random() * Math.PI, Math.random() * 0.2);
          mesh.userData = { basePosition: mesh.position.clone(), speed: 0.4 + Math.random() * 0.7 };
          
          galaxy.add(mesh);
          interactiveCards.push(mesh);
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function checkIntersection(clientX, clientY) {
          if (cardModal.classList.contains('active') || !overlay.classList.contains('hidden')) return;
          mouse.x = (clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(clientY / window.innerHeight) * 2 + 1;
          
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(interactiveCards);
          if (intersects.length > 0) {
            spawnHearts(clientX, clientY, 25);
            openVisualCard();
          }
        }

        window.addEventListener('click', (e) => { checkIntersection(e.clientX, e.clientY); });
        window.addEventListener('touchend', (e) => {
          if (e.changedTouches && e.changedTouches[0]) {
            checkIntersection(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
          }
        });

        const coreR = 12;
        const coreTexCanvas = document.createElement('canvas'); 
        coreTexCanvas.width = coreTexCanvas.height = 256;
        const cg = coreTexCanvas.getContext('2d'); 
        const grd = cg.createRadialGradient(128, 128, 10, 128, 128, 128);
        grd.addColorStop(0, '#140018'); 
        grd.addColorStop(0.6, '#090012'); 
        grd.addColorStop(1, '#000'); 
        cg.fillStyle = grd; 
        cg.arc(128, 128, 128, 0, Math.PI * 2); 
        cg.fill();
        
        const core = new THREE.Mesh(new THREE.SphereGeometry(coreR, 64, 64), new THREE.MeshBasicMaterial({ 
          map: new THREE.CanvasTexture(coreTexCanvas) 
        }));
        core.renderOrder = 1; 
        scene.add(core);

        const photonRing = new THREE.Mesh(new THREE.RingGeometry(coreR * 1.05, coreR * 1.18, 128), new THREE.MeshBasicMaterial({ 
          color: 0xEAAEFF, 
          transparent: true, 
          opacity: 0.95, 
          side: THREE.DoubleSide 
        }));
        photonRing.rotation.x = -Math.PI / 2; 
        photonRing.renderOrder = 0.5; 
        scene.add(photonRing);

        function makeHaloTexture(size = 1024, inner = 0.45) {
          const c = document.createElement('canvas'); 
          c.width = c.height = size; 
          const g = c.getContext('2d'); 
          const r = size / 2;
          const grd = g.createRadialGradient(r, r, r * inner, r, r, r);
          grd.addColorStop(0.0, 'rgba(255,200,240,0.45)');
          grd.addColorStop(0.35, 'rgba(220,180,255,0.35)');
          grd.addColorStop(0.7, 'rgba(160,200,255,0.28)');
          grd.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = grd; 
          g.fillRect(0, 0, size, size); 
          const tex = new THREE.CanvasTexture(c); 
          tex.needsUpdate = true; 
          return tex;
        }
        
        const haloPlane = new THREE.Mesh(new THREE.PlaneGeometry(320, 320), new THREE.MeshBasicMaterial({ 
          map: makeHaloTexture(1024, 0.45), 
          transparent: true, 
          depthWrite: false, 
          blending: THREE.AdditiveBlending, 
          opacity: 0.9 
        }));
        haloPlane.rotation.x = -Math.PI / 2; 
        haloPlane.renderOrder = 0.2; 
        scene.add(haloPlane);

        let tw = 0;
        function animate() {
          requestAnimationFrame(animate);
          const t = performance.now() * 0.001;
          tw = (tw + 0.0003) % 1;
          
          starTex.offset.set(tw, 0); 
          galaxy.rotation.y = t * 0.05;
          core.rotation.y = t * 0.12;
          photonRing.rotation.z = t * 0.18;
          haloPlane.rotation.z = t * 0.02;

          interactiveCards.forEach(card => {
            const ud = card.userData;
            card.position.y = ud.basePosition.y + Math.sin(t * ud.speed) * 0.4;
          });
          
          controls.update();
          renderer.render(scene, camera);
        } 
        animate();

      } catch(e) { 
        showError('Error cargando la galaxia: ' + e.message); 
        console.error(e); 
      }

      // ==========================================
      // ====== EFECTO DE CORAZONES (2D CANVAS) ====
      // ==========================================
      const fx = document.getElementById('fx');
      const ctx2 = fx.getContext('2d');
      
      function resizeFx() {
        fx.width = Math.floor(innerWidth * Math.min(2, window.devicePixelRatio || 1));
        fx.height = Math.floor(innerHeight * Math.min(2, window.devicePixelRatio || 1));
        fx.style.width = innerWidth + 'px';
        fx.style.height = innerHeight + 'px';
      }
      window.addEventListener('resize', resizeFx); 
      resizeFx();

      const DPR = Math.min(2, window.devicePixelRatio || 1);
      const hearts = [];

      function spawnHearts(x, y, n = 20) {
        x *= DPR; 
        y *= DPR;
        for (let i = 0; i < n; i++) { 
          const a = Math.random() * Math.PI * 2;
          hearts.push({
            x,
            y,
            vx: Math.cos(a) * (0.6 + Math.random() * 0.8),
            vy: -(0.8 + Math.random() * 1.2),
            life: 1,
            size: 10 + Math.random() * 16
          });
        }
      }

      function drawHeart(x, y, size) {
        const s = size; 
        ctx2.save(); 
        ctx2.translate(x, y);
        ctx2.beginPath(); 
        ctx2.moveTo(0, -0.25 * s);
        ctx2.bezierCurveTo(.5 * s, -.9 * s, 1.4 * s, -.1 * s, 0, .9 * s);
        ctx2.bezierCurveTo(-1.4 * s, -.1 * s, -.5 * s, -.9 * s, 0, -0.25 * s);
        
        const g = ctx2.createRadialGradient(0, 0, 0, 0, 0, s);
        g.addColorStop(0, 'rgba(255,190,220,.95)'); 
        g.addColorStop(1, 'rgba(255,90,160,0)');
        
        ctx2.fillStyle = g; 
        ctx2.fill(); 
        ctx2.restore();
      }

      let lastTap = 0;
      window.addEventListener('click', (e) => { 
        const now = performance.now(); 
        if (now - lastTap < 320) spawnHearts(e.clientX, e.clientY, 20); 
        lastTap = now; 
      }, { passive: true });

      window.addEventListener('touchend', (e) => { 
        const now = performance.now(); 
        const t = e.changedTouches && e.changedTouches[0]; 
        if (now - lastTap < 320 && t) spawnHearts(t.clientX, t.clientY, 20); 
        lastTap = now; 
      }, { passive: true });

      function loopFx() {
        ctx2.clearRect(0, 0, fx.width, fx.height);
        for (let i = hearts.length - 1; i >= 0; i--) { 
          const h = hearts[i]; 
          h.x += h.vx; 
          h.y += h.vy; 
          h.vy -= 0.02; 
          h.life -= 0.015;
          
          ctx2.globalAlpha = Math.max(0, h.life); 
          drawHeart(h.x, h.y, h.size); 
          ctx2.globalAlpha = 1; 
          
          if (h.life <= 0) hearts.splice(i, 1);
        }
        requestAnimationFrame(loopFx);
      } 
      loopFx();

    })();
  </script>
</body>
